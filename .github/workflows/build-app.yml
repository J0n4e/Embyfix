name: Build EmbyFlix.app

# Manual only: run from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: ./make-app.sh

      - name: Zip app
        run: cd dist && ditto -c -k --keepParent EmbyFlix.app EmbyFlix.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyFlix-app
          path: dist/EmbyFlix.zip

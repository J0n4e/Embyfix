name: Build Cove.app

# Run workflow (Actions tab): builds the app as a downloadable artifact, for testing.
# Push a version tag (git tag v1.15.0 && git push origin v1.15.0): builds, signs and attests the release and
# creates it as a DRAFT on GitHub. Write the notes and publish it there; the in-app updater only sees published releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the app (e.g. v0.5Beta). Leave empty to use the latest git tag.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write        # create the draft release (tag builds only)
      id-token: write        # build provenance attestation (tag builds only)
      attestations: write
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      HAS_CERT: ${{ secrets.CODESIGN_P12 != '' }}
      HAS_UPDATE_KEY: ${{ secrets.COVE_UPDATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # tags, for the version shown in the app

      - name: Show Swift version
        run: swift --version

      - name: Check release setup
        if: env.IS_RELEASE == 'true'
        run: |
          grep -q 'static let publicKey = ""' Sources/Updater.swift && { echo "::error::Updater.publicKey is empty (see RELEASING.md)"; exit 1; }
          [ "$HAS_UPDATE_KEY" = true ] || { echo "::error::Secret COVE_UPDATE_KEY is missing (see RELEASING.md)"; exit 1; }
          [ "$HAS_CERT" = true ] || { echo "::error::Secret CODESIGN_P12 is missing (see RELEASING.md)"; exit 1; }

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: echo "CODESIGN_IDENTITY=$(scripts/ci-import-cert.sh)" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then unset VERSION; fi
          ./make-app.sh
          codesign -dv dist/Cove.app 2>&1 | grep -E 'Identifier|Authority|Signature|flags'

      - name: Smoke test (the app starts and keeps running)
        run: |
          dist/Cove.app/Contents/MacOS/Cove & PID=$!
          sleep 15
          kill -0 $PID || { echo "::error::Cove exited during launch"; exit 1; }
          kill $PID

      - name: Zip app
        run: cd dist && ditto -c -k --keepParent Cove.app Cove.zip

      - name: Sign update
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          COVE_UPDATE_KEY: ${{ secrets.COVE_UPDATE_KEY }}
        run: |
          PUB=$(sed -n 's/.*static let publicKey = "\(.*\)".*/\1/p' Sources/Updater.swift)
          swift scripts/sign-update.swift dist/Cove.zip $PUB

      - name: Attest build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Cove.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cove-app
          path: |
            dist/Cove.zip
            dist/Cove.zip.sig
          if-no-files-found: error

      - name: Create draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Cove.zip dist/Cove.zip.sig --draft --title "Cove $TAG" \
            --notes "Built by GitHub Actions from $(git rev-parse --short HEAD). Write the release notes here, then publish."
